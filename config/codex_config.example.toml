# Example ~/.codex/config.toml (Mac/Linux) or %USERPROFILE%\.codex\config.toml (Windows)
# Place this in your .codex directory to configure Codex CLI with NVIDIA NIM

model = "nvidia/nemotron-3-ultra-550b-a55b"
model_provider = "nvidia_nim"

[model_providers.nvidia_nim]
name = "NVIDIA NIM"
base_url = "https://integrate.api.nvidia.com/v1"
env_key = "NVIDIA_API_KEY"
wire_api = "responses"
